[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omega-api-otel"
version = "0.1.0"
description = "OpenTelemetry instrumentation for Omega-API evaluation events."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Davide Lugli" }]
keywords = ["omega-api", "opentelemetry", "observability", "evaluation", "genai", "agent", "judge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "omega-api>=0.1.0",
    "opentelemetry-api>=1.44",
]

[project.optional-dependencies]
test = ["opentelemetry-sdk>=1.44"]

[project.urls]
Homepage = "https://omega.dailui.com/integrations.php"
Source = "https://github.com/DaiLui/omega-api-examples"

[tool.hatch.build.targets.wheel]
packages = ["omega_api_otel"]

[tool.hatch.build.targets.sdist]
include = ["omega_api_otel", "examples", "tests", "README.md", "LICENSE"]
